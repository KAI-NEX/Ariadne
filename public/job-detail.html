<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ariadne · 职位详情</title>
    <link rel="stylesheet" href="/styles.css?v=v1-motion-33">
  </head>
  <body class="v1-body" data-v1-page="job-detail">
    <main class="v1-page-shell v1-detail-shell">
      <header class="v1-topbar">
        <a class="v1-back" href="/jd.html" aria-label="返回职位描述"></a>
        <p class="v1-detail-breadcrumb">职位描述 / 职位上下文</p>
        <details class="v1-menu">
          <summary aria-label="打开导航菜单"><span></span><span></span></summary>
          <nav aria-label="主导航">
            <a href="/workspace.html">工作空间</a><a href="/personal-information.html">个人资料</a><a aria-current="page" href="/jd.html">职位描述</a><a href="/index.html">运行方式</a>
          </nav>
        </details>
      </header>

      <section class="v1-split-view">
        <article class="v1-structured-pane job">
          <div class="v1-detail-meta-row"><span class="v1-type-chip">职位</span><span class="v1-review-chip">待审核</span></div>
          <h1 id="job-title">正在读取…</h1>
          <p id="job-company" class="v1-detail-subtitle"></p><p id="job-location" class="v1-detail-time"></p>
          <section class="v1-detail-block"><p class="v1-section-label">摘要</p><p id="job-summary" class="v1-detail-summary"></p></section>
          <section class="v1-detail-block"><p class="v1-section-label">任职要求</p><div id="job-requirements" class="v1-requirement-list"></div></section>
          <section class="v1-detail-block"><p class="v1-section-label">来源</p><p id="job-source" class="v1-source-note"></p></section>
        </article>

        <aside id="job-ai-pane" class="v1-conversation-pane hidden" aria-labelledby="job-ai-heading">
          <div class="v1-conversation-heading"><p class="v1-section-label">AI 对话</p><span id="job-ai-runtime">仅限当前职位</span></div>
          <h2 id="job-ai-heading">只讨论当前职位</h2>
          <p class="v1-conversation-copy">使用当前选择的模型讨论这张职位卡片。回答仅解释当前职位内容，不评估候选人与职位的匹配程度。</p>
          <div id="job-conversation-messages" class="v1-conversation-messages" aria-live="polite"></div>
          <section id="job-patch-proposal" class="v1-patch-card hidden">
            <p class="v1-section-label">待审核修改建议</p>
            <div class="v1-diff-grid"><div><small>修改前</small><p id="job-patch-before"></p></div><div><small>修改后</small><p id="job-patch-after"></p></div></div>
            <p id="job-patch-reason" class="v1-patch-reason"></p>
            <div class="v1-button-row"><button id="accept-job-patch" class="v1-primary-button" type="button">确认修改</button><button id="reject-job-patch" class="v1-tertiary-button" type="button">拒绝建议</button></div>
          </section>
          <form id="job-conversation-form" class="v1-conversation-form">
            <label class="sr-only" for="job-conversation-input">询问当前职位</label>
            <textarea id="job-conversation-input" placeholder="例如：这份职位最核心的三个要求是什么？"></textarea>
            <button type="submit" aria-label="发送"></button>
          </form>
        </aside>

      </section>
      <p id="job-detail-message" class="v1-inline-message" aria-live="polite"></p>
    </main>
    <script src="/v1-demo-domain.js?v=v1-motion-33"></script>
    <script src="/scoped-conversation-domain.js"></script>
    <script src="/floating-window.js?v=v1-motion-33"></script>
    <script src="/v1-pages.js?v=v1-motion-33"></script>
  </body>
</html>
