<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://generativelanguage.googleapis.com; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Ariadne · 连接 Gemini</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="runtime-page">
    <main class="runtime-connect-shell">
      <a class="runtime-back-link" href="/"><span class="runtime-back-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 5.5 8.5 12 15 18.5" /></svg></span><span>返回运行选择</span></a>
      <p class="runtime-step">Gemini · 图文验证</p>
      <h1>连接 Gemini</h1>
      <p class="runtime-connect-copy">图文验证已准备完成；在本次测试获批前不会向模型服务商发出请求。API 密钥不会发送给 Ariadne 服务端，也不会写入网址、日志、IndexedDB 或本机钥匙串。</p>
      <form id="gemini-connect-form" class="runtime-connect-form" novalidate>
        <label for="gemini-api-key">Gemini API 密钥</label>
        <input id="gemini-api-key" type="password" autocomplete="off" spellcheck="false" placeholder="仅本次连接使用" />
        <button id="gemini-connect" type="submit">开始图文验证</button>
      </form>
      <p id="gemini-connect-message" class="runtime-message" aria-live="polite"></p>
      <div class="runtime-guide-links">
        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer">获取 Gemini API 密钥（Google AI Studio）↗</a>
        <a href="/gemini-api-key-guide.html">查看 API 密钥获取与安全说明</a>
      </div>
    </main>
    <script src="/gemini-browser-runtime.js?v=multimodal-v1"></script>
    <script src="/gemini-connect.js?v=multimodal-v1"></script>
  </body>
</html>
