<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ariadne · 了解职位概况</title>
  <link rel="stylesheet" href="/styles.css?v=job-overview-v1&amp;vi=1&amp;composer=2">
  <link rel="stylesheet" href="/personal-understanding.css?v=job-overview-v1&amp;vi=1">
  <link rel="stylesheet" href="/vi/layout.css?v=1">
  <link rel="stylesheet" href="/job-overview.css?v=1">
  <link rel="stylesheet" href="/understanding-chat.css?v=1&amp;composer=2">
</head>
<body class="v1-body" data-v1-page="job-overview">
<main class="v1-page-shell vi-container personal-understanding-shell">
  <header class="v1-topbar">
    <a class="v1-back" href="/jd.html" aria-label="返回职位描述"></a>
    <p class="v1-detail-breadcrumb">职位描述 / 职位概况</p>
    <a class="personal-add-link" href="/jd-import.html"><span class="vi-icon" data-icon="plus" aria-hidden="true"></span> 添加 JD</a>
  </header>
  <div class="vi-grid job-overview-layout">
    <section class="vi-span-6 personal-knowledge" aria-labelledby="job-overview-heading">
      <div class="personal-heading-row"><div><p class="v1-section-label">先理解职位本身</p><h1 id="job-overview-heading">了解职位概况</h1></div><button id="refresh-job-overview" class="v1-secondary-button" type="button">更新概况</button></div>
      <p class="personal-meta">汇总你添加的 JD，梳理职责、要求、共同点与差异。这里专注职位；你的项目与经历在个人理解中讨论。</p>
      <p id="job-overview-state" class="personal-meta" aria-live="polite">正在读取职位…</p>
      <a class="job-overview-jump" href="#job-overview-dialogue-heading">开始跨职位对话 <span class="vi-icon" data-icon="arrow-down" aria-hidden="true"></span></a>
      <p id="job-overview-summary" class="personal-overview"></p>
      <div id="job-overview-insights"></div>
      <div id="job-overview-unknowns"></div>
      <details class="personal-history"><summary>查看本次范围内的全部 JD</summary><div id="job-overview-directory"></div></details>
    </section>
    <section class="vi-span-6 personal-dialogue v1-conversation-pane" aria-labelledby="job-overview-dialogue-heading">
      <div class="personal-heading-row"><h2 id="job-overview-dialogue-heading">了解职位概况</h2><span id="job-overview-runtime" class="personal-meta"></span></div>
      <p class="personal-meta">可以对比多个 JD、讨论岗位类型与要求差异。概况和讨论不会改写原 JD，也不会读取或修改个人资料。</p>
      <div class="personal-prompts" aria-label="开始讨论">
        <button type="button" data-job-overview-prompt="请总结我添加的全部 JD，分别说明它们是什么类型的岗位。">总结全部 JD</button>
        <button type="button" data-job-overview-prompt="这些 JD 有哪些共同要求和重要差异？请注明各自的来源。">共性与差异</button>
        <button type="button" data-job-overview-prompt="哪些职位要求或团队背景还不明确，需要向招聘方进一步确认？">需要确认什么</button>
      </div>
      <button id="job-overview-older" class="personal-text-button hidden" type="button">查看更早对话</button>
      <div id="job-overview-messages" class="v1-conversation-messages v1-conversation-thread" aria-live="polite"></div>
      <div id="job-overview-processing" class="v1-conversation-status hidden" aria-live="polite"></div>
      <form id="job-overview-form" class="v1-conversation-form">
        <label class="sr-only" for="job-overview-message">讨论全部职位描述</label>
        <div class="v1-composer-field"><textarea id="job-overview-message" maxlength="6000" placeholder="聊聊这些职位…"></textarea></div>
        <button type="submit" aria-label="发送"></button>
      </form>
      <label class="personal-consent"><input id="job-overview-consent" type="checkbox"><span id="job-overview-consent-copy"></span></label>
      <p id="job-overview-usage" class="personal-meta"></p>
      <p id="job-overview-status" class="v1-inline-message" aria-live="polite"></p>
      <a href="/personal-understanding.html" class="job-overview-scope-link">回顾我的项目与经历 <span class="vi-icon" data-icon="chevron-right" aria-hidden="true"></span></a>
    </section>
  </div>
</main>
<script src="/local-connector.js"></script>
<script src="/runtime-capabilities.js"></script><script src="/runtime-capability-gate.js"></script>
<script src="/truth-persistence-domain.js"></script><script src="/job-intelligence-contract-manifest.js"></script><script src="/job-context-domain.js"></script>
<script src="/personal-context-domain.js"></script><script src="/job-overview-contract.js"></script><script src="/job-overview-domain.js"></script>
<script src="/processing-indicator-domain.js"></script><script src="/conversation-ui-domain.js"></script>
<script src="/v1-demo-domain.js"></script><script src="/v1-pages.js"></script><script src="/job-overview.js"></script>
</body>
</html>
