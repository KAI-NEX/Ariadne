services:
  web:
    build:
      context: ..
    environment:
      ARIADNE_WEB_ORIGINS: https://ariadne.kai-nex.com
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: 1536m
    cpus: 2
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on: [web]
volumes:
  certificates:
  caddy_config:
